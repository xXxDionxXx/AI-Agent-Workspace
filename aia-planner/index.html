<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIA Financial Health Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="platform-laptop">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="platform-toggle" id="platformToggle">
        <button class="plat-btn active" data-platform="laptop" title="Laptop">💻</button>
        <button class="plat-btn" data-platform="ipad" title="iPad">📟</button>
        <button class="plat-btn" data-platform="phone" title="Phone">📱</button>
    </div>
    <div class="slides-container" id="slidesContainer"></div>
    <div class="slide-nav">
        <button class="nav-btn" id="btnPrev" onclick="prevSlide()"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span class="slide-counter" id="slideCounter">1 / 15</span>
        <button class="nav-btn nav-btn-primary" id="btnNext" onclick="nextSlide()"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4L14 10L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
